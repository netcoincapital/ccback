server {
    listen 80;
    listen [::]:80;
    server_name coinceeper.com www.coinceeper.com;
    return 301 https://coinceeper.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coinceeper.com www.coinceeper.com;

    ssl_certificate /etc/letsencrypt/live/coinceeper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coinceeper.com/privkey.pem;

    root /var/www/coinceeper;
    index index.html;

    location /_next/static/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location = /api/app-stats {
        default_type application/json;
        add_header Cache-Control public;
        try_files /api/app-stats =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ $uri.html $uri/index.html /index.html;
    }
}
