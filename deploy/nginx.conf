# =============================================================================
# Hybrid Backend Proxy — Nginx Configuration
# =============================================================================

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # --- Basic Settings ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # --- MIME Types ---
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=32k;
    error_log /var/log/nginx/error.log warn;

    # --- SSL Settings (اگر SSL دارید) ---
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # --- Rate Limiting Zones ---
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=stable_limit:10m rate=10r/s;

    # --- Upstream: Flask Gunicorn ---
    upstream flask_backend {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # ==================== Main Server Block ====================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name coinceeper.com www.coinceeper.com;

        # --- Root for static files ---
        root /app/static;
        index index.html;

        # ==================== V2/V3 API Endpoints ====================

        # Health check (بدون محدودیت)
        location /api/v2/health {
            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # Proxy Health (full)
        location /api/v2/proxy-health {
            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # V2 Public endpoints (rate limited but stable)
        location /api/v2/ {
            limit_req zone=stable_limit burst=20 nodelay;

            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache control برای V2
            add_header Cache-Control "public, max-age=30";
            add_header X-Cache-Status "MISS";

            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # V3 Enhanced endpoints (explorer, balance, broadcast)
        location /api/v2/explorer/ {
            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Broadcast (بدون cache)
        location /api/v2/broadcast {
            limit_req zone=stable_limit burst=5 nodelay;

            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ==================== Legacy API Endpoints ====================

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ==================== WebSocket (Chat) ====================
        location /socket.io/ {
            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # ==================== Static Files ====================
        location /static/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ==================== API Docs ====================
        location /api-docs/ {
            alias /app/api-docs/;
            expires 1h;
        }

        # ==================== PHPMyAdmin Proxy ====================
        location /tools/ {
            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # ==================== Deny access to sensitive files ====================
        location ~ /\.env {
            deny all;
            return 404;
        }
        location ~ /\.git {
            deny all;
            return 404;
        }
        location ~ /__pycache__ {
            deny all;
            return 404;
        }

        # ==================== Default ====================
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ==================== Error Pages ====================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
