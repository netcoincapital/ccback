# =============================================================================
# Hybrid Backend Proxy — Supervisor Configuration
# =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ==================== Gunicorn (Flask App) ====================
[program:gunicorn]
command=gunicorn app:app \
    --worker-class gevent \
    --workers 4 \
    --threads 2 \
    --timeout 120 \
    --keep-alive 5 \
    --bind 0.0.0.0:5000 \
    --max-requests 10000 \
    --max-requests-jitter 1000 \
    --access-logfile /var/log/gunicorn/access.log \
    --access-logformat '%(h)s %(l)s %(u)s %(t)s "%(r)s" %(s)s %(b)s "%(f)s" "%(a)s" %(L)s' \
    --error-logfile /var/log/gunicorn/error.log \
    --log-level info \
    --capture-output \
    --enable-stdio-inheritance

directory=/app
user=root
autostart=true
autorestart=true
startretries=3
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/var/log/gunicorn/stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/gunicorn/stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=
    PYTHONPATH="/app",
    FLASK_ENV="production"

# ==================== Nginx ====================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stopsignal=QUIT
stopwaitsecs=10
stdout_logfile=/var/log/nginx/supervisor_stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/nginx/supervisor_stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# ==================== Gunicorn Log Directory Setup ====================
[eventlistener:mkdir]
command=/bin/mkdir -p /var/log/gunicorn
autorestart=true
startretries=3
